name: Checks

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install pytest requests ruff
      - run: ruff check src tests
      - run: PYTHONPATH=src python -m pytest -q
